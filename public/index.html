<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3347;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --user-bubble: #2563eb;
      --claude-bubble: #1e2235;
      --accent: #4a9eff;
      --error: #ef4444;
      --radius: 12px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; }

    #app { display: flex; flex-direction: row; height: 100vh; }

    #sidebar { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #sidebar .sidebar-heading { font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 14px 14px 8px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
    #history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 0 8px 8px; }
    .history-entry { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; transition: background 0.15s, color 0.15s; }
    .history-entry-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .history-entry-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-entry-time { font-size: 10px; color: var(--text-muted); }
    .history-entry:hover { background: var(--surface); color: var(--text); }
    .history-entry.active { background: var(--surface); color: var(--text); }

    #chat-area { display: flex; flex-direction: column; flex: 1; min-width: 0; }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .logo { font-size: 20px; }
    header h1 { font-size: 16px; font-weight: 600; color: var(--text); }
    header .team-name { font-size: 13px; color: var(--text-muted); }
    header .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    #model-selector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    #model-selector:hover, #model-selector:focus { border-color: var(--accent); color: var(--text); }

    #new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    #new-chat-btn:hover { border-color: var(--accent); color: var(--text); }

    #thread {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.claude { align-self: flex-start; align-items: flex-start; }

    /* Wrapper for claude bubble + copy button */
    .bubble-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 3px; white-space: pre-wrap; }
    .msg.claude .bubble { background: var(--claude-bubble); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 3px; }

    .msg-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }

    .cursor::after { content: '\25AE'; animation: blink 0.8s step-end infinite; color: var(--accent); font-size: 12px; }
    @keyframes blink { 50% { opacity: 0; } }

    .loading-dots { display: inline-flex; gap: 4px; align-items: center; padding: 2px 0; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: dot-pulse 1.2s infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse { 0%, 60%, 100% { opacity: 0.2; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } }

    /* Copy button — sits below the bubble, never overlaps text */
    .copy-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--accent); }

    #input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      padding: 10px 14px;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.15s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      height: 44px;
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #send-btn:disabled { opacity: 0.4; cursor: default; }
    #send-btn:not(:disabled):hover { opacity: 0.85; }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
    }
    #empty-state .big-icon { font-size: 48px; }

    .msg.error .bubble { border-color: var(--error); color: var(--error); }

    /* Code blocks rendered via DOM — these classes are set programmatically */
    .bubble code {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      padding: 1px 5px;
    }
    .bubble pre {
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
      white-space: pre;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 4px; font-weight: 600; line-height: 1.3; }
    .bubble h1 { font-size: 1.4em; }
    .bubble h2 { font-size: 1.2em; }
    .bubble h3 { font-size: 1.05em; }
    .bubble ul, .bubble ol { margin: 4px 0 4px 20px; }
    .bubble li { margin: 2px 0; }
    hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

    .char-count { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-align: right; }

    .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 0.9em; }
    .bubble th { background: rgba(255,255,255,0.06); font-weight: 600; }
    .bubble tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    .delete-btn { flex-shrink: 0; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; }
    .delete-btn:hover { color: var(--error); }

    /* Scroll-to-bottom button — F-018 */
    #scroll-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      z-index: 50;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      background: var(--accent);
      border: none;
      color: white;
      cursor: pointer;
      display: none;
      font-size: 18px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: opacity 0.15s;
    }
    #scroll-btn:hover { opacity: 0.85; }
    #scroll-btn.visible { display: flex; }

    /* Sidebar overlay — covers content area on mobile when sidebar is open */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(0,0,0,0.4);
    }
    #sidebar-overlay.overlay-visible { display: block; }

    /* Sidebar close button — visible only on mobile */
    #sidebar-close-btn {
      display: none;
      align-self: flex-end;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
      padding: 8px 12px 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #sidebar-close-btn:hover { color: var(--text); }

    /* Hamburger — hidden on desktop, shown on mobile */
    #hamburger-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      line-height: 1;
      padding: 4px 8px;
      cursor: pointer;
    }
    #hamburger-btn:hover { color: var(--text); }

    @media (max-width: 600px) {
      #hamburger-btn { display: block; }
      #sidebar-close-btn { display: block; }
      #sidebar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        z-index: 100;
        background: var(--bg);
        width: 220px;
        border-right: 1px solid var(--border);
      }
      #sidebar.sidebar-open { display: flex; }
      header { flex-wrap: nowrap; padding: 10px 12px; gap: 6px; }
      header h1 { font-size: 14px; }
      header .logo { font-size: 16px; }
      #model-selector { max-width: 130px; font-size: 11px; }
      #new-chat-btn { font-size: 11px; padding: 4px 6px; }
    }
  </style>
</head>
<body>
<div id="sidebar-overlay"></div>
<div id="confirm-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:200">
  <div style="background:#1e2235;border-radius:12px;padding:24px;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
    <p style="color:#e2e8f0;margin:0 0 20px;font-size:0.95rem">Start a new chat? Your current conversation will remain in history.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button id="confirm-cancel-btn" style="background:#2e3347;color:#e2e8f0;border:1px solid #4a5568;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:0.9rem">Cancel</button>
      <button id="confirm-ok-btn" style="background:#e53e3e;color:white;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:0.9rem">New Chat</button>
    </div>
  </div>
</div>
<div id="app">
  <div id="sidebar">
    <button id="sidebar-close-btn" title="Close sidebar">&times;</button>
    <div class="sidebar-heading">History</div>
    <div id="history-list"></div>
  </div>
  <div id="chat-area">
    <header>
      <button id="hamburger-btn" title="Toggle sidebar">&#9776;</button>
      <span class="logo">&#x1F4AC;</span>
      <h1>Claude Chat</h1>
      <span class="team-name" id="team-name"></span>
      <div class="header-right">
        <select id="model-selector" title="Select model">
          <option value="claude-haiku-4-5-20251001">Haiku</option>
          <option value="claude-sonnet-4-6" selected>Sonnet</option>
          <option value="claude-opus-4-5">Opus</option>
        </select>
        <button id="new-chat-btn" title="Start a new conversation">+ New Chat</button>
      </div>
    </header>

    <div id="thread">
      <div id="empty-state">
        <span class="big-icon">&#x1F4AC;</span>
        <p>Ask Claude anything to get started.</p>
      </div>
    </div>

    <button id="scroll-btn" title="Scroll to bottom">&#8595;</button>
    <div id="input-area">
      <textarea id="msg-input" rows="1" placeholder="Message Claude (Enter or Cmd+Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send-btn" title="Send">&#9658;</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Stable conversation ID for this browser session — scopes history on the server
  var conversationId = crypto.randomUUID();

  // Track whether the first message has been sent in the current conversation
  var firstMessageSent = false;

  // Currently selected model — updated by the model selector in the header
  var currentModel = 'claude-sonnet-4-6';

  var thread = document.getElementById('thread');
  var input = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');
  var emptyState = document.getElementById('empty-state');
  var modelSelector = document.getElementById('model-selector');
  var newChatBtn = document.getElementById('new-chat-btn');
  var historyList = document.getElementById('history-list');
  var hamburgerBtn = document.getElementById('hamburger-btn');
  var sidebar = document.getElementById('sidebar');
  var sidebarOverlay = document.getElementById('sidebar-overlay');
  var sidebarCloseBtn = document.getElementById('sidebar-close-btn');
  var scrollBtn = document.getElementById('scroll-btn');
  var confirmModal = document.getElementById('confirm-modal');
  var confirmCancelBtn = document.getElementById('confirm-cancel-btn');
  var confirmOkBtn = document.getElementById('confirm-ok-btn');

  function showConfirmModal() {
    return new Promise(function (resolve) {
      confirmModal.style.display = 'flex';
      function onOk() {
        confirmModal.style.display = 'none';
        confirmCancelBtn.removeEventListener('click', onCancel);
        resolve(true);
      }
      function onCancel() {
        confirmModal.style.display = 'none';
        confirmOkBtn.removeEventListener('click', onOk);
        resolve(false);
      }
      confirmOkBtn.addEventListener('click', onOk, { once: true });
      confirmCancelBtn.addEventListener('click', onCancel, { once: true });
    });
  }

  // --- localStorage history helpers ---
  var HISTORY_KEY = 'chat-history';

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
  }

  function saveHistory(history) {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function pushConversationToHistory(id, title) {
    var history = getHistory().filter(function (h) { return h.id !== id; });
    history.unshift({ id: id, title: title, timestamp: Date.now() });
    if (history.length > 20) history = history.slice(0, 20);
    saveHistory(history);
  }

  function relativeTime(ts) {
    if (!ts) return '';
    var diff = Date.now() - ts;
    var min = 60 * 1000;
    var hour = 60 * min;
    var day = 24 * hour;
    if (diff < min) return 'just now';
    if (diff < hour) return Math.floor(diff / min) + ' min ago';
    if (diff < day) { var h = Math.floor(diff / hour); return h + ' hour' + (h !== 1 ? 's' : '') + ' ago'; }
    if (diff < 2 * day) return 'yesterday';
    return new Date(ts).toLocaleDateString();
  }

  function renderHistoryList() {
    while (historyList.firstChild) historyList.removeChild(historyList.firstChild);
    var history = getHistory();
    history.forEach(function (entry) {
      var el = document.createElement('div');
      el.className = 'history-entry' + (entry.id === conversationId ? ' active' : '');
      el.title = entry.title || '';

      var content = document.createElement('div');
      content.className = 'history-entry-content';

      var titleSpan = document.createElement('span');
      titleSpan.className = 'history-entry-title';
      titleSpan.textContent = entry.title || '(untitled)';
      content.appendChild(titleSpan);

      if (entry.timestamp) {
        var timeSpan = document.createElement('span');
        timeSpan.className = 'history-entry-time';
        timeSpan.textContent = relativeTime(entry.timestamp);
        content.appendChild(timeSpan);
      }

      var delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '\u00D7';
      delBtn.title = 'Delete conversation';
      delBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteConversation(entry.id);
      });
      el.appendChild(content);
      el.appendChild(delBtn);

      el.addEventListener('click', function () {
        loadConversation(entry.id);
        // B-030: auto-close sidebar on mobile after selecting a conversation
        if (window.innerWidth <= 600) closeSidebar();
      });
      historyList.appendChild(el);
    });
  }

  function deleteConversation(id) {
    var history = getHistory().filter(function (h) { return h.id !== id; });
    saveHistory(history);

    fetch('/api/conversations/' + id, { method: 'DELETE' }).catch(function () {});

    if (conversationId === id) {
      conversationId = crypto.randomUUID();
      firstMessageSent = false;
      while (thread.firstChild) thread.removeChild(thread.firstChild);
      var es = document.createElement('div');
      es.id = 'empty-state';
      var icon = document.createElement('span');
      icon.className = 'big-icon';
      icon.textContent = '\uD83D\uDCAC';
      var p = document.createElement('p');
      p.textContent = 'Ask Claude anything to get started.';
      es.appendChild(icon);
      es.appendChild(p);
      thread.appendChild(es);
      emptyState = es;
    }

    renderHistoryList();
  }

  async function loadConversation(id) {
    conversationId = id;
    firstMessageSent = true;
    renderHistoryList();

    // Clear thread
    while (thread.firstChild) thread.removeChild(thread.firstChild);
    emptyState = null;

    try {
      var res = await fetch('/api/conversations/' + id);
      if (res.status === 404) {
        // Stale history entry — server restarted and lost this conversation.
        // Keep entry in sidebar; show error bubble with explicit Remove button.
        var errBubble = addMsg('claude', {isError: true});
        errBubble.closest('.msg').classList.add('error');
        errBubble.textContent = 'This conversation is no longer available (server was restarted).';
        var removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remove from history';
        removeBtn.style.cssText = 'display:block;margin-top:8px;padding:4px 10px;cursor:pointer;background:#2e3347;color:#e2e8f0;border:1px solid #4a5568;border-radius:6px;';
        removeBtn.addEventListener('click', function () {
          var filtered = getHistory().filter(function (h) { return h.id !== id; });
          saveHistory(filtered);
          renderHistoryList();
          removeBtn.remove();
        });
        errBubble.appendChild(removeBtn);
        return;
      }
      if (!res.ok) throw new Error('Failed to load conversation');
      var data = await res.json();
      var messages = data.messages || data;
      messages.forEach(function (m) {
        var role = m.role === 'user' ? 'user' : 'claude';
        var bubble = addMsg(role);
        if (role === 'user') {
          bubble.textContent = m.content;
        } else {
          var mdText = typeof m.content === 'string' ? m.content : (m.content[0] && m.content[0].text) || '';
          renderTextInto(bubble, mdText);
          bubble.dataset.markdown = mdText;
          // B-025: compute and show stats for history-loaded Claude messages
          var chars = mdText.length;
          var wc = mdText.trim().split(/\s+/).filter(Boolean).length;
          bubble.dataset.charcount = chars;
          bubble.dataset.wordcount = wc;
          var histStatsLabel = document.createElement('div');
          histStatsLabel.className = 'char-count';
          histStatsLabel.textContent = chars + ' chars \u00B7 ' + wc + (wc === 1 ? ' word' : ' words');
          bubble.closest('.msg').appendChild(histStatsLabel);
        }
      });
    } catch (err) {
      var bubble = addMsg('claude', {isError: true});
      bubble.closest('.msg').classList.add('error');
      bubble.textContent = 'Error loading conversation: ' + err.message;
    }
  }

  // Show team segment from hostname: "jane-finance.ai.example.com" → "finance"
  var hostSlug = location.hostname.split('.')[0] || '';
  var dashIdx = hostSlug.indexOf('-');
  if (dashIdx !== -1) {
    document.getElementById('team-name').textContent = hostSlug.slice(dashIdx + 1);
  }

  // Render history list on page load; refresh timestamps every 60 seconds (F-014)
  renderHistoryList();
  setInterval(renderHistoryList, 60 * 1000);

  // Restore saved model on page load
  var savedModel = localStorage.getItem('selectedModel');
  if (savedModel) {
    modelSelector.value = savedModel;
    if (modelSelector.value !== savedModel) {
      // Stale model ID no longer matches any option — clear it
      localStorage.removeItem('selectedModel');
    } else {
      currentModel = savedModel;
    }
  }

  // Track model selection and persist it
  modelSelector.addEventListener('change', function () {
    currentModel = modelSelector.value;
    localStorage.setItem('selectedModel', currentModel);
  });

  // New Chat: generate a fresh conversation ID and reset the thread
  newChatBtn.addEventListener('click', async function () {
    if (thread.querySelector('.msg.user')) {
      var confirmed = await showConfirmModal();
      if (!confirmed) return;
    }
    conversationId = crypto.randomUUID();
    firstMessageSent = false;
    while (thread.firstChild) thread.removeChild(thread.firstChild);

    var es = document.createElement('div');
    es.id = 'empty-state';

    var icon = document.createElement('span');
    icon.className = 'big-icon';
    icon.textContent = '\uD83D\uDCAC';

    var p = document.createElement('p');
    p.textContent = 'Ask Claude anything to get started.';

    es.appendChild(icon);
    es.appendChild(p);
    thread.appendChild(es);
    emptyState = es;
    renderHistoryList();
    input.focus();
  });

  function openSidebar() {
    sidebar.classList.add('sidebar-open');
    sidebarOverlay.classList.add('overlay-visible');
  }

  function closeSidebar() {
    sidebar.classList.remove('sidebar-open');
    sidebarOverlay.classList.remove('overlay-visible');
  }

  // Hamburger: toggle sidebar visibility on mobile
  hamburgerBtn.addEventListener('click', function () {
    if (sidebar.classList.contains('sidebar-open')) {
      closeSidebar();
    } else {
      openSidebar();
    }
  });

  // Close button inside sidebar
  sidebarCloseBtn.addEventListener('click', closeSidebar);

  // Overlay click dismisses sidebar
  sidebarOverlay.addEventListener('click', closeSidebar);

  // B-019: Scroll-to-bottom button — show when scrolled up, hide when at bottom
  function updateScrollBtn() {
    if (thread.scrollHeight - thread.scrollTop - thread.clientHeight > 100) {
      scrollBtn.classList.add('visible');
    } else {
      scrollBtn.classList.remove('visible');
    }
  }
  thread.addEventListener('scroll', updateScrollBtn);
  scrollBtn.addEventListener('click', function () {
    thread.scrollTop = thread.scrollHeight;
    scrollBtn.classList.remove('visible');
  });


  // B-022: Mobile placeholder — shorten at ≤600px
  function updatePlaceholder() {
    input.placeholder = window.innerWidth <= 600
      ? 'Message Claude...'
      : 'Message Claude (Enter to send, Shift+Enter for newline)';
  }
  updatePlaceholder();
  window.addEventListener('resize', updatePlaceholder);

  // Auto-resize textarea up to max-height
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addMsg(role, opts) {
    var isError = opts && opts.isError;
    if (emptyState && emptyState.parentNode) {
      emptyState.parentNode.removeChild(emptyState);
      emptyState = null;
    }
    var msg = document.createElement('div');
    msg.className = 'msg ' + role;

    var label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'Claude';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    msg.appendChild(label);

    if (role === 'claude') {
      // Wrap bubble + copy button in a relative container for hover positioning
      var wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      wrap.appendChild(bubble);

      if (!isError) {
        var copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.title = 'Copy message';
        copyBtn.addEventListener('click', function () {
          var text = bubble.dataset.markdown || bubble.textContent;
          function showCopied() {
            copyBtn.textContent = 'Copied!';
            setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
          }
          function showFailed() {
            copyBtn.textContent = 'Copy failed \u2014 HTTPS required';
            setTimeout(function () { copyBtn.textContent = 'Copy'; }, 2500);
          }
          function fallbackCopy() {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
            if (ok) { showCopied(); } else { showFailed(); }
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
          } else {
            fallbackCopy();
          }
        });
        wrap.appendChild(copyBtn);
      }
      msg.appendChild(wrap);
    } else {
      msg.appendChild(bubble);
    }

    thread.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function scrollToBottom() {
    thread.scrollTop = thread.scrollHeight;
    updateScrollBtn();
  }

  function setStreaming(active) {
    sendBtn.disabled = active;
    input.disabled = active;
  }

  // Maps known API/network error strings to human-readable messages.
  // Returns { text: string, details: string|null }.
  function friendlyErrorMessage(raw) {
    if (!raw) return { text: 'Something went wrong. Please try again.', details: null };
    var r = String(raw);
    if (r.indexOf('authentication_error') !== -1) {
      return { text: 'API key is invalid or not configured. Please contact your administrator.', details: null };
    }
    if (r.indexOf('rate_limit_error') !== -1) {
      return { text: 'Rate limit reached. Please wait a moment and try again.', details: null };
    }
    if (r.indexOf('overloaded_error') !== -1) {
      return { text: 'Claude is currently busy. Please try again in a few seconds.', details: null };
    }
    if (r.indexOf('fetch') !== -1 || r.indexOf('network') !== -1 || r.indexOf('Failed to fetch') !== -1 || r.indexOf('NetworkError') !== -1) {
      return { text: 'Could not reach the server. Check your connection and try again.', details: null };
    }
    return { text: 'Something went wrong. Please try again.', details: r };
  }

  async function sendMessage() {
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    var userBubble = addMsg('user');
    // B-031: render inline markdown (**bold**, *italic*, `code`) in user bubbles
    appendInlineSegmentsSingleLine(userBubble, text);
    input.value = '';
    input.style.height = 'auto';

    // Save to history on first message of this conversation
    if (!firstMessageSent) {
      firstMessageSent = true;
      pushConversationToHistory(conversationId, text.slice(0, 40));
      renderHistoryList();
    }

    setStreaming(true);
    var claudeBubble = addMsg('claude');
    claudeBubble.classList.add('cursor');

    var loadingDots = document.createElement('div');
    loadingDots.className = 'loading-dots';
    for (var k = 0; k < 3; k++) loadingDots.appendChild(document.createElement('span'));
    claudeBubble.appendChild(loadingDots);
    var firstToken = true;

    var accumulated = '';

    try {
      var response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationId: conversationId, model: currentModel }),
      });

      if (!response.ok) {
        throw new Error('Server error ' + response.status);
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';

      while (true) {
        var read = await reader.read();
        if (read.done) break;
        buf += decoder.decode(read.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (!line.startsWith('data: ')) continue;
          var parsed;
          try { parsed = JSON.parse(line.slice(6)); } catch (e) { continue; }

          if (parsed.token) {
            if (firstToken) {
              claudeBubble.removeChild(loadingDots);
              firstToken = false;
            }
            accumulated += parsed.token;
            renderTextInto(claudeBubble, accumulated);
            scrollToBottom();
          }
          if (parsed.error) {
            claudeBubble.closest('.msg').classList.add('error');
            var errCopyBtn = claudeBubble.parentNode && claudeBubble.parentNode.querySelector('.copy-btn');
            if (errCopyBtn) errCopyBtn.remove();
            var friendlyMsg = friendlyErrorMessage(parsed.error);
            if (firstToken) {
              claudeBubble.removeChild(loadingDots);
              firstToken = false;
            }
            while (claudeBubble.firstChild) claudeBubble.removeChild(claudeBubble.firstChild);
            claudeBubble.appendChild(document.createTextNode(friendlyMsg.text));
            if (friendlyMsg.details) {
              var details = document.createElement('details');
              details.style.marginTop = '6px';
              var summary = document.createElement('summary');
              summary.textContent = 'Details';
              details.appendChild(summary);
              var pre = document.createElement('pre');
              pre.style.cssText = 'margin:4px 0 0;white-space:pre-wrap;font-size:0.85em;';
              pre.textContent = friendlyMsg.details;
              details.appendChild(pre);
              claudeBubble.appendChild(details);
            }
          }
          if (parsed.done && parsed.chars !== undefined) {
            claudeBubble.dataset.charcount = parsed.chars;
            if (parsed.words !== undefined) claudeBubble.dataset.wordcount = parsed.words;
          }
        }
      }
    } catch (err) {
      claudeBubble.closest('.msg').classList.add('error');
      var netErrCopyBtn = claudeBubble.parentNode && claudeBubble.parentNode.querySelector('.copy-btn');
      if (netErrCopyBtn) netErrCopyBtn.remove();
      var netMsg = friendlyErrorMessage(err.message);
      if (firstToken && loadingDots.parentNode === claudeBubble) {
        claudeBubble.removeChild(loadingDots);
      }
      while (claudeBubble.firstChild) claudeBubble.removeChild(claudeBubble.firstChild);
      claudeBubble.appendChild(document.createTextNode(netMsg.text));
      if (netMsg.details) {
        var errDetails = document.createElement('details');
        errDetails.style.marginTop = '6px';
        var errSummary = document.createElement('summary');
        errSummary.textContent = 'Details';
        errDetails.appendChild(errSummary);
        var errPre = document.createElement('pre');
        errPre.style.cssText = 'margin:4px 0 0;white-space:pre-wrap;font-size:0.85em;';
        errPre.textContent = netMsg.details;
        errDetails.appendChild(errPre);
        claudeBubble.appendChild(errDetails);
      }
    }

    // Store original markdown so the copy button can copy the source (F-016)
    if (accumulated) claudeBubble.dataset.markdown = accumulated;
    claudeBubble.classList.remove('cursor');
    if (claudeBubble.dataset.charcount) {
      var charLabel = document.createElement('div');
      charLabel.className = 'char-count';
      var statsText = claudeBubble.dataset.charcount + ' chars';
      if (claudeBubble.dataset.wordcount) { var wc = parseInt(claudeBubble.dataset.wordcount, 10); statsText += ' \u00B7 ' + wc + (wc === 1 ? ' word' : ' words'); }
      charLabel.textContent = statsText;
      claudeBubble.closest('.msg').appendChild(charLabel);
    }
    scrollToBottom();
    setStreaming(false);
    input.focus();
  }

  // ---------------------------------------------------------------------------
  // Safe DOM-based text renderer.
  // Parses fenced code blocks and inline code; all text is set via textContent
  // (never innerHTML) to prevent XSS. Handles newlines with <br> elements.
  // ---------------------------------------------------------------------------
  function renderTextInto(el, text) {
    // Clear existing children
    while (el.firstChild) el.removeChild(el.firstChild);

    // Split on fenced code blocks first (``` ... ```)
    var parts = text.split(/(```[\w]*\n?[\s\S]*?```)/g);

    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (part.startsWith('```')) {
        // Code block — strip fences and optional lang tag, set via textContent
        var code = part.replace(/^```[\w]*\n?/, '').replace(/```$/, '');
        var pre = document.createElement('pre');
        var codeEl = document.createElement('code');
        codeEl.textContent = code;
        pre.appendChild(codeEl);
        el.appendChild(pre);
      } else {
        // Regular text: handle headings, lists, inline code, and newlines
        processTextLines(el, part);
      }
    }
  }

  function appendInlineSegments(parent, text) {
    // Split on inline code (`...`)
    var segments = text.split(/(`[^`\n]+`)/g);
    for (var i = 0; i < segments.length; i++) {
      var seg = segments[i];
      if (seg.startsWith('`') && seg.endsWith('`') && seg.length > 2) {
        var code = document.createElement('code');
        code.textContent = seg.slice(1, -1);
        parent.appendChild(code);
      } else {
        // Split on newlines and insert <br> elements; apply bold/italic per line
        var lines = seg.split('\n');
        for (var j = 0; j < lines.length; j++) {
          if (lines[j]) appendFormattedLine(parent, lines[j]);
          if (j < lines.length - 1) parent.appendChild(document.createElement('br'));
        }
      }
    }
  }

  // Parses a GFM table row into trimmed cell strings.
  // Strips leading/trailing pipes, splits on '|', trims each cell.
  function parseTableCells(row) {
    return row.replace(/^\||\|$/g, '').split('|').map(function(c) { return c.trim(); });
  }

  // Processes a text part line-by-line: detects headings (# ## ###), unordered lists (- item),
  // GFM pipe tables, and regular text.
  // Contiguous list lines are grouped into a <ul>/<ol>; heading lines become h1/h2/h3.
  // Inline formatting (bold/italic/code) is applied to all content via appendInlineSegmentsSingleLine.
  // B-029: blank lines between list items do NOT close the list — only two consecutive blanks
  // or a non-list structural element (heading/HR/table/code) will close it.
  function processTextLines(parent, text) {
    var lines = text.split('\n');
    var currentList = null;
    var pendingListClose = false; // B-029: deferred close on first blank line in a list
    var consecutiveBlanks = 0;   // B-029: two consecutive blanks force-close the list
    var regularLines = [];

    function flushRegularLines() {
      for (var k = 0; k < regularLines.length; k++) {
        if (k > 0) parent.appendChild(document.createElement('br'));
        if (regularLines[k]) appendInlineSegmentsSingleLine(parent, regularLines[k]);
      }
      regularLines = [];
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];

      // GFM table detection: line 0 is a pipe row, line 1 is a separator row
      if (/^\|.+\|$/.test(line) && i + 1 < lines.length && /^\|[-| :]+\|$/.test(lines[i + 1])) {
        flushRegularLines();
        currentList = null;
        pendingListClose = false;
        consecutiveBlanks = 0;

        // Collect all contiguous pipe-delimited lines as the table block
        var tableLines = [];
        while (i < lines.length && /^\|.+\|/.test(lines[i])) {
          tableLines.push(lines[i]);
          i++;
        }
        i--; // Counteract the outer for-loop's i++

        var table = document.createElement('table');
        var thead = document.createElement('thead');
        var tbody = document.createElement('tbody');

        // Header row (tableLines[0]); separator row (tableLines[1]) is skipped
        var headerCells = parseTableCells(tableLines[0]);
        var headerRow = document.createElement('tr');
        for (var h = 0; h < headerCells.length; h++) {
          var th = document.createElement('th');
          appendInlineSegmentsSingleLine(th, headerCells[h]);
          headerRow.appendChild(th);
        }
        thead.appendChild(headerRow);
        table.appendChild(thead);

        // Data rows start at index 2
        for (var r = 2; r < tableLines.length; r++) {
          var cells = parseTableCells(tableLines[r]);
          var tr = document.createElement('tr');
          for (var c = 0; c < cells.length; c++) {
            var td = document.createElement('td');
            appendInlineSegmentsSingleLine(td, cells[c]);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        parent.appendChild(table);
        continue;
      }

      // Heading detection: # ## ###
      var hm = line.match(/^(#{1,3}) (.*)/);
      if (hm) {
        flushRegularLines();
        currentList = null;
        pendingListClose = false;
        consecutiveBlanks = 0;
        var hEl = document.createElement('h' + hm[1].length);
        appendInlineSegmentsSingleLine(hEl, hm[2]);
        parent.appendChild(hEl);
        continue;
      }

      // Horizontal rule: --- or *** on their own line
      var trimmed = line.trim();
      if (trimmed === '---' || trimmed === '***') {
        flushRegularLines();
        currentList = null;
        pendingListClose = false;
        consecutiveBlanks = 0;
        parent.appendChild(document.createElement('hr'));
        continue;
      }

      // B-029: Blank line handling — defer list close inside a list context
      if (trimmed === '') {
        if (currentList) {
          consecutiveBlanks++;
          if (consecutiveBlanks >= 2) {
            // Two consecutive blanks: force-close the list
            currentList = null;
            pendingListClose = false;
            consecutiveBlanks = 0;
          } else {
            pendingListClose = true;
          }
          // Skip adding to regularLines while inside list
          continue;
        }
        consecutiveBlanks = 0;
        regularLines.push(line);
        continue;
      }

      // Non-blank line — reset consecutive blank counter
      consecutiveBlanks = 0;

      // Unordered list item: - item
      if (line.startsWith('- ')) {
        flushRegularLines();
        if (pendingListClose && currentList && currentList.tagName === 'UL') {
          // Continue the existing UL across the blank line
          pendingListClose = false;
        } else {
          if (pendingListClose) { currentList = null; pendingListClose = false; }
          if (!currentList || currentList.tagName !== 'UL') {
            currentList = document.createElement('ul');
            parent.appendChild(currentList);
          }
        }
        var li = document.createElement('li');
        appendInlineSegmentsSingleLine(li, line.slice(2));
        currentList.appendChild(li);
        continue;
      }

      // Ordered list item: 1. item  2. item  etc.
      var olm = line.match(/^\d+\. (.*)/);
      if (olm) {
        flushRegularLines();
        if (pendingListClose && currentList && currentList.tagName === 'OL') {
          // Continue the existing OL across the blank line
          pendingListClose = false;
        } else {
          if (pendingListClose) { currentList = null; pendingListClose = false; }
          if (!currentList || currentList.tagName !== 'OL') {
            currentList = document.createElement('ol');
            parent.appendChild(currentList);
          }
        }
        var li = document.createElement('li');
        appendInlineSegmentsSingleLine(li, olm[1]);
        currentList.appendChild(li);
        continue;
      }

      // Regular non-blank line — close list context (including any pending close)
      currentList = null;
      pendingListClose = false;
      regularLines.push(line);
    }

    flushRegularLines();
  }

  // Renders a single line (no newlines) with inline code and bold/italic support.
  function appendInlineSegmentsSingleLine(parent, text) {
    var segments = text.split(/(`[^`\n]+`)/g);
    for (var i = 0; i < segments.length; i++) {
      var seg = segments[i];
      if (seg.startsWith('`') && seg.endsWith('`') && seg.length > 2) {
        var code = document.createElement('code');
        code.textContent = seg.slice(1, -1);
        parent.appendChild(code);
      } else {
        if (seg) appendFormattedLine(parent, seg);
      }
    }
  }

  // Renders a single line of text with ***bold+italic***, **bold**, and *italic* support (no newlines).
  function appendFormattedLine(parent, text) {
    var parts = text.split(/(\*{3}[^*]+\*{3}|\*\*[^*]+\*\*|\*[^*\n]+\*)/g);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.startsWith('***') && p.endsWith('***') && p.length > 6) {
        var strong = document.createElement('strong');
        var em = document.createElement('em');
        em.textContent = p.slice(3, -3);
        strong.appendChild(em);
        parent.appendChild(strong);
      } else if (p.startsWith('**') && p.endsWith('**') && p.length > 4) {
        var strong = document.createElement('strong');
        strong.textContent = p.slice(2, -2);
        parent.appendChild(strong);
      } else if (p.startsWith('*') && p.endsWith('*') && p.length > 2) {
        var em = document.createElement('em');
        em.textContent = p.slice(1, -1);
        parent.appendChild(em);
      } else {
        if (p) parent.appendChild(document.createTextNode(p));
      }
    }
  }
}());
</script>
</body>
