<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3347;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --user-bubble: #2563eb;
      --claude-bubble: #1e2235;
      --accent: #4a9eff;
      --error: #ef4444;
      --radius: 12px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; }

    #app { display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header .logo { font-size: 20px; }
    header h1 { font-size: 16px; font-weight: 600; color: var(--text); }
    header .team-name { font-size: 13px; color: var(--text-muted); }
    header .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    #model-selector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    #model-selector:hover, #model-selector:focus { border-color: var(--accent); color: var(--text); }

    #new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }
    #new-chat-btn:hover { border-color: var(--accent); color: var(--text); }

    #thread {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.claude { align-self: flex-start; align-items: flex-start; }

    /* Wrapper for claude bubble + copy button */
    .bubble-wrap { position: relative; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.55;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 3px; white-space: pre-wrap; }
    .msg.claude .bubble { background: var(--claude-bubble); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 3px; }

    .msg-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }

    .cursor::after { content: '\25AE'; animation: blink 0.8s step-end infinite; color: var(--accent); font-size: 12px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Copy button — hidden by default, shown on bubble-wrap hover */
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .bubble-wrap:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--text); border-color: var(--accent); }

    #input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      padding: 10px 14px;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      outline: none;
      transition: border-color 0.15s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      height: 44px;
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    #send-btn:disabled { opacity: 0.4; cursor: default; }
    #send-btn:not(:disabled):hover { opacity: 0.85; }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
    }
    #empty-state .big-icon { font-size: 48px; }

    .msg.error .bubble { border-color: var(--error); color: var(--error); }

    /* Code blocks rendered via DOM — these classes are set programmatically */
    .bubble code {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 13px;
      padding: 1px 5px;
    }
    .bubble pre {
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
      white-space: pre;
    }
    .bubble pre code { background: none; padding: 0; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">&#x1F4AC;</span>
    <h1>Claude Chat</h1>
    <span class="team-name" id="team-name"></span>
    <div class="header-right">
      <select id="model-selector" title="Select model">
        <option value="claude-haiku-4-5-20251001">Haiku &#x2014; fast</option>
        <option value="claude-sonnet-4-6" selected>Sonnet &#x2014; balanced</option>
        <option value="claude-opus-4-6">Opus &#x2014; powerful</option>
      </select>
      <button id="new-chat-btn" title="Start a new conversation">+ New Chat</button>
    </div>
  </header>

  <div id="thread">
    <div id="empty-state">
      <span class="big-icon">&#x1F4AC;</span>
      <p>Ask Claude anything to get started.</p>
    </div>
  </div>

  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="Message Claude (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send-btn" title="Send">&#9658;</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Stable conversation ID for this browser session — scopes history on the server
  var conversationId = crypto.randomUUID();

  // Currently selected model — updated by the model selector in the header
  var currentModel = 'claude-sonnet-4-6';

  var thread = document.getElementById('thread');
  var input = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');
  var emptyState = document.getElementById('empty-state');
  var modelSelector = document.getElementById('model-selector');
  var newChatBtn = document.getElementById('new-chat-btn');

  // Show team segment from hostname: "jane-finance.ai.example.com" → "finance"
  var hostSlug = location.hostname.split('.')[0] || '';
  var dashIdx = hostSlug.indexOf('-');
  if (dashIdx !== -1) {
    document.getElementById('team-name').textContent = hostSlug.slice(dashIdx + 1);
  }

  // Track model selection
  modelSelector.addEventListener('change', function () {
    currentModel = modelSelector.value;
  });

  // New Chat: generate a fresh conversation ID and reset the thread
  newChatBtn.addEventListener('click', function () {
    conversationId = crypto.randomUUID();
    while (thread.firstChild) thread.removeChild(thread.firstChild);

    var es = document.createElement('div');
    es.id = 'empty-state';

    var icon = document.createElement('span');
    icon.className = 'big-icon';
    icon.textContent = '\uD83D\uDCAC';

    var p = document.createElement('p');
    p.textContent = 'Ask Claude anything to get started.';

    es.appendChild(icon);
    es.appendChild(p);
    thread.appendChild(es);
    emptyState = es;
    input.focus();
  });

  // Auto-resize textarea up to max-height
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addMsg(role) {
    if (emptyState && emptyState.parentNode) {
      emptyState.parentNode.removeChild(emptyState);
      emptyState = null;
    }
    var msg = document.createElement('div');
    msg.className = 'msg ' + role;

    var label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'Claude';

    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    msg.appendChild(label);

    if (role === 'claude') {
      // Wrap bubble + copy button in a relative container for hover positioning
      var wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      wrap.appendChild(bubble);

      var copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy';
      copyBtn.title = 'Copy message';
      copyBtn.addEventListener('click', function () {
        var text = bubble.textContent;
        navigator.clipboard.writeText(text).then(function () {
          copyBtn.textContent = 'Copied!';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
        }).catch(function () {
          // clipboard API unavailable (non-secure context); fail silently
        });
      });
      wrap.appendChild(copyBtn);
      msg.appendChild(wrap);
    } else {
      msg.appendChild(bubble);
    }

    thread.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  function scrollToBottom() {
    thread.scrollTop = thread.scrollHeight;
  }

  function setStreaming(active) {
    sendBtn.disabled = active;
    input.disabled = active;
  }

  async function sendMessage() {
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    var userBubble = addMsg('user');
    userBubble.textContent = text;
    input.value = '';
    input.style.height = 'auto';

    setStreaming(true);
    var claudeBubble = addMsg('claude');
    claudeBubble.classList.add('cursor');

    var accumulated = '';

    try {
      var response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, conversationId: conversationId, model: currentModel }),
      });

      if (!response.ok) {
        throw new Error('Server error ' + response.status);
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';

      while (true) {
        var read = await reader.read();
        if (read.done) break;
        buf += decoder.decode(read.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          if (!line.startsWith('data: ')) continue;
          var parsed;
          try { parsed = JSON.parse(line.slice(6)); } catch (e) { continue; }

          if (parsed.token) {
            accumulated += parsed.token;
            renderTextInto(claudeBubble, accumulated);
            scrollToBottom();
          }
          if (parsed.error) {
            claudeBubble.closest('.msg').classList.add('error');
            renderTextInto(claudeBubble, accumulated || ('Error: ' + parsed.error));
          }
        }
      }
    } catch (err) {
      claudeBubble.closest('.msg').classList.add('error');
      claudeBubble.textContent = 'Error: ' + err.message;
    }

    claudeBubble.classList.remove('cursor');
    scrollToBottom();
    setStreaming(false);
    input.focus();
  }

  // ---------------------------------------------------------------------------
  // Safe DOM-based text renderer.
  // Parses fenced code blocks and inline code; all text is set via textContent
  // (never innerHTML) to prevent XSS. Handles newlines with <br> elements.
  // ---------------------------------------------------------------------------
  function renderTextInto(el, text) {
    // Clear existing children
    while (el.firstChild) el.removeChild(el.firstChild);

    // Split on fenced code blocks first (``` ... ```)
    var parts = text.split(/(```[\w]*\n?[\s\S]*?```)/g);

    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (part.startsWith('```')) {
        // Code block — strip fences and optional lang tag, set via textContent
        var code = part.replace(/^```[\w]*\n?/, '').replace(/```$/, '');
        var pre = document.createElement('pre');
        var codeEl = document.createElement('code');
        codeEl.textContent = code;
        pre.appendChild(codeEl);
        el.appendChild(pre);
      } else {
        // Regular text: handle inline code and newlines
        appendInlineSegments(el, part);
      }
    }
  }

  function appendInlineSegments(parent, text) {
    // Split on inline code (`...`)
    var segments = text.split(/(`[^`\n]+`)/g);
    for (var i = 0; i < segments.length; i++) {
      var seg = segments[i];
      if (seg.startsWith('`') && seg.endsWith('`') && seg.length > 2) {
        var code = document.createElement('code');
        code.textContent = seg.slice(1, -1);
        parent.appendChild(code);
      } else {
        // Split on newlines and insert <br> elements
        var lines = seg.split('\n');
        for (var j = 0; j < lines.length; j++) {
          if (lines[j]) parent.appendChild(document.createTextNode(lines[j]));
          if (j < lines.length - 1) parent.appendChild(document.createElement('br'));
        }
      }
    }
  }
}());
</script>
</body>
</html>
